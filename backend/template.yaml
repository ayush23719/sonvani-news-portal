Outputs:
  PublicApiUrl:
    Description: Public API Gateway base URL.
    Value: !Sub 'https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/api/v1'
  PublicApiDomainName:
    Description: API Gateway execute-api domain used by the Lambda@Edge preview router.
    Value: !Sub '${PublicApi}.execute-api.${AWS::Region}.amazonaws.com'
  PublicApiStageName:
    Description: API Gateway stage name used by the Lambda@Edge preview router.
    Value: !Ref EnvironmentName
  ArticlesTableName:
    Description: DynamoDB articles table name.
    Value: !Ref ArticlesTable
  MediaBucketName:
    Description: S3 media bucket name.
    Value: !Ref MediaBucket
  FrontendBucketName:
    Description: S3 bucket used to host the React frontend.
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID for the React frontend.
    Value: !Ref FrontendDistribution
  FrontendDistributionDomainName:
    Description: CloudFront distribution domain name for DNS troubleshooting.
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendDomainName:
    Description: Primary frontend domain.
    Value: !Ref FrontendDomainName
  ArticleSocialPreviewOriginRequestLambdaVersionArn:
    Description: Lambda@Edge origin-request version ARN attached to /articles/* when configured.
    Value: !Ref ArticleSocialPreviewOriginRequestLambdaVersionArn
  PublicReadFunctionRoleArn:
    Description: IAM role used by public read Lambda functions.
    Value: !GetAtt PublicReadFunctionRole.Arn
