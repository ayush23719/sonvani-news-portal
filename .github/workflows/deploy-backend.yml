name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Validate SAM template
        run: sam validate --lint --template template.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy SAM stack
        run: |
          sam deploy --stack-name sonvani-news-prod --resolve-s3 --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides EnvironmentName=prod FrontendBucketName=sonvani-news-frontend-prod FrontendDomainName=sonvani.in WwwFrontendDomainName=www.sonvani.in HostedZoneId=${{ secrets.ROUTE53_HOSTED_ZONE_ID }} AcmCertificateArn=${{ secrets.ACM_CERTIFICATE_ARN }} CognitoUserPoolId=${{ secrets.COGNITO_USER_POOL_ID }} AllowedCorsOrigin=https://sonvani.in,https://www.sonvani.in ArticleSocialPreviewOriginRequestLambdaVersionArn=${{ secrets.ARTICLE_SOCIAL_PREVIEW_EDGE_LAMBDA_VERSION_ARN }}
