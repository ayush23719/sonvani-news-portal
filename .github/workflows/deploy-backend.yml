name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace backend

      - name: Build backend
        run: npm run build --workspace backend

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --lint --template backend/template.yaml

      - name: Build SAM application
        working-directory: backend
        run: sam build --template-file template.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy SAM stack
        run: |
          sam deploy \
            --template-file backend/.aws-sam/build/template.yaml \
            --stack-name sonvani-backend-dev \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              EnvironmentName=dev \
              LogLevel=info \
              CognitoUserPoolId=${{ secrets.COGNITO_USER_POOL_ID }} \
              AllowedCorsOrigin="*" \
              ArticleSocialPreviewOriginRequestLambdaVersionArn=${{ secrets.ARTICLE_SOCIAL_PREVIEW_EDGE_LAMBDA_VERSION_ARN }}
